aid: lara-networks
name: Lara Networks
description: 'Lara Networks, Inc. (founded as Lara Technology) was a fabless semiconductor
  company headquartered at 110 Nortech Parkway, San Jose, California, that architected,
  designed, and marketed silicon-based packet-processing solutions for high-speed Internet
  and networking infrastructure. Its products were built on a patent-pending Associative
  Processing Technology (APT) and manufactured on 0.18-micron process technology: Network
  Database Search Engine (NDSE) devices, network coprocessors, and NDSE subsystems, with
  Content-Aware Switching (CAS) solutions in development. The devices were content-addressable
  memory search engines that offloaded ultra-large table lookups from network processors —
  holding tables of more than three million addresses and sustaining over 100 million lookups
  per second so switches and routers could process packets from Layer 2 to Layer 7 at full
  line rate at OC-48 (2.5Gbps) and above. The company raised a $40 million second round in
  October 2000 led by Raza Ventures with Battery Ventures, InveStar Capital, and TeleSoft
  Venture Partners, alongside a long-term co-development agreement and minority equity
  investment from STMicroelectronics. Lara Networks no longer operates independently: by
  January 2003 its laranetworks.com domain served Cypress Semiconductor Corporation content,
  and today every path on the domain 301-redirects to Infineon Technologies, which acquired
  Cypress in April 2020. As a fabless chip company selling silicon to network equipment
  manufacturers, Lara Networks never operated a web or developer API program, and no public
  API surface exists to enrich. This profile is retained as an acquired-company lead.'
