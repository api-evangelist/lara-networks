- probe: https://www.laranetworks.com/
  result: 301 -> https://www.infineon.com/about/company?site=www.laranetworks.com
  note: every path, including /.well-known/security.txt, /.well-known/api-catalog and
    /llms.txt, 301-redirects to the same Infineon corporate page; the site= query parameter
    echoes the requested laranetworks.com hostname, Infineon's standard handling for domains
    it holds from acquired entities
- probe: whois laranetworks.com
  result: created 2000-01-22, registrar CSC Corporate Domains, name servers
    pdns1/pdns2.cscdns.net — an enterprise corporate registrar, not an expired or parked domain
- probe: apex laranetworks.com over HTTPS
  result: no response (connection failure); only the www host answers, and only to redirect
- probe: web.archive.org snapshot 2001-05-15 of www.laranetworks.com
  result: live Lara Networks site describing APT, NDSE devices, network coprocessors and the
    LNI7000 family; the investors page lists Battery Ventures, InveStar Capital, Raza Ventures,
    TeleSoft Venture Partners and STMicroelectronics
- probe: web.archive.org snapshot 2002 of www.laranetworks.com/aboutus/profile.cfm
  result: serves "Cypress - About Us" dated Jan. 16, 2003, copyright Cypress Semiconductor
    Corporation — the domain had been folded into Cypress's site by then
- probe: developer/API surface search across the live domain and the archived site
  result: none — no developer portal, documentation, API reference, SDKs, or machine-readable
    specification has ever existed for this company
